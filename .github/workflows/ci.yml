# Runs the platform-neutral Core tests on Linux and Windows, and checks the Linux app still packages.
# Release builds stay in release.yml.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test apps/windows/tests/Palwyn.Core.Tests --nologo
      - run: dotnet test apps/linux/tests/Palwyn.Linux.Tests --nologo

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash tools/linux/build-appimage.sh 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ci
          path: dist/*
          retention-days: 7
